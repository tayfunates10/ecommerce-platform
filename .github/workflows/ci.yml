name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce?schema=public
      NEXT_PUBLIC_SITE_URL: https://ci.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply committed migrations to empty PostgreSQL
        run: npm run db:migrate:deploy

      - name: Assert database and Prisma schema have zero drift
        run: npx prisma migrate diff --exit-code --from-config-datasource --to-schema prisma/schema.prisma

      - name: Seed database-backed storefront audit fixture
        run: bash tests/audit/fixtures/setup.sh

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and domain tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Assert build leaves tracked files clean
        run: git diff --exit-code -- .

      - name: Enforce performance budgets
        run: npm run perf:budget

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E, accessibility and visual contracts
        run: npm run test:e2e

      - name: Bootstrap committed visual baselines once
        if: failure() && github.event_name == 'pull_request' && github.head_ref == 'fix/ux-audit-remediation'
        run: |
          if [ -n "$(git status --porcelain -- tests/e2e/snapshots)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git fetch origin "${GITHUB_HEAD_REF}"
            git switch -C "${GITHUB_HEAD_REF}" "origin/${GITHUB_HEAD_REF}"
            git add tests/e2e/snapshots
            git commit -m "test(visual): commit Playwright baselines"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Database-backed usage UI UX audit
        run: npm run test:ux-audit

      - name: Upload browser certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-certification
          path: |
            playwright-report
            playwright-report-audit
            test-results
          if-no-files-found: warn
          retention-days: 7
