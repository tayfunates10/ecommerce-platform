name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecommerce?schema=public
      NEXT_PUBLIC_SITE_URL: https://ci.example.invalid
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate commerce baseline candidate
        run: npx prisma migrate diff --from-empty --to-schema prisma/schema.prisma --script --output migration-baseline-candidate.sql

      - name: Upload commerce baseline candidate
        uses: actions/upload-artifact@v4
        with:
          name: migration-baseline-candidate
          path: migration-baseline-candidate.sql
          if-no-files-found: error
          retention-days: 1

      - name: Require committed baseline before continuing
        run: |
          echo "::error::Migration baseline candidate generated. Commit the reviewed SQL before enabling the remaining CI gates."
          exit 1

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build

      - name: Enforce performance budgets
        run: npm run perf:budget

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E, accessibility and visual contracts
        run: npm run test:e2e

      - name: Upload browser certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-certification
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
